<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chương trình đoán số may mắn</h2>
    <label for="number">Nhập một số từ 1 đến 10:</label>
    <input type="number" id="number" min="1" max="10">
    <br><br>
    <button onclick="doanso()">Đoán</button>
    <h3 id="result"></h3>
    <script>
        function doanso() {
            let number = Number(document.getElementById("number").value);
            let randomNum = Math.floor(Math.random() * 10) + 1;
            if (number === randomNum) {
                document.getElementById("result").innerHTML = 
                "Chúc mừng! Bạn đã đoán đúng số may mắn: " + randomNum;
            } else {
                document.getElementById("result").innerHTML = 
                "Rất tiếc! Số may mắn là: " + randomNum + ". Chúc bạn may mắn lần sau!";
            }
        }
    </script>
</body>
</html>
