<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKB</title>
    <style>
        body {
            text-align: center;
        }

        table {
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h2>LỊCH HỌC</h2>
    <table border="3" cellspacing="0" cellpadding="10">
        <tr>
            <th>Thứ</th>
            <th>Hai</th>
            <th>Ba</th>
            <th>Tư</th>
            <th>Năm</th>
            <th>Sáu</th>
        </tr>
        <tr>
            <td rowspan="2">Sáng</td>
            <td>LTHDT</td>
            <td rowspan="2">CTDL-GT</td>
            <td rowspan="2">PTHD</td>
            <td>CSDL</td>
            <td rowspan="2">CSDL</td>
        </tr>
        <tr>
            <td>LTW</td>
            <td>LTW</td>
        </tr>
        <tr>
            <td rowspan="2">Chiều</td>
            <td>TDTT</td>
            <td>QTM</td>
            <td>TRR</td>
            <td colspan="2">TDTT</td>
        </tr>
        <tr>
            <td colspan="2">AV</td>
            <td>CSDL</td>
            <td colspan="2">CNTT-CB</td>
        </tr>
    </table>
</body>
</html>
