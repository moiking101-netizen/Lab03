<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHIEU DANG KY</title>
</head>
<body>
    <table border="1">
        <form>
            <h2> PHIẾU ĐĂNG KÝ </h2>
            <tr>
                <td> HỌ VÀ TÊN: <input type="text"> (*)</td>
            </tr>
            <tr>
                <td> ĐỊA CHỈ: <input type="text"> </td>
            </tr>
            <tr>
                <td> EMAIL: <input type="email">(*) </td>
            </tr>
            <tr>
                <td> GIỚI TÍNH: <input type="radio"> Nam <input type="radio"> Nữ </td>
            </tr>
            <tr>
                <td> TUỔI: <input type="number"> (*) </td>
            </tr>
            <tr>
                <td> SỞ THÍCH:
                    <br><input type="checkbox"> Thể thao </br> 
                    <br><input type="checkbox"> Văn học </br> 
                    <br><input type="checkbox"> Công nghệ Thông tin </br> 
                    <br><input type="checkbox"> Lịch sử </br> 
                    <br><input type="checkbox"> Game </br> 
                </td>
            </tr>
            <tr>
                <td> Chuyên ngành: 
                
                    <select>
                        <option> Công nghệ web </option>
                        <option> An ninh mạng </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="goi-hinh">Gởi hình:</label>
                    <input type="file" id="goi-hinh" name="goi-hinh">
                </td>
            </tr>
            <tr>
                <td><label for="yeu-cau">Yêu cầu:</label>
                    <textarea id="yeu-cau" name="yeu-cau" rows="5" cols="35"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Gởi thông tin">
                    <input type="reset" value="Nhập lại">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
