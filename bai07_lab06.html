<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chương trình xúc xắc may mắn</h2>
    <button onclick="rollDice()">Quay xúc xắc</button>
    <h3 id="result"></h3>
    <script>
        function rollDice() {
            const diceValue = Math.floor(Math.random() * 6) + 1;
            document.getElementById("result").innerHTML = "Kết quả: " + diceValue;
        }
    </script>
</body>
</html>
