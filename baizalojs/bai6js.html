<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 6 - Calculate Average</title>
</head>
<body>
    <h2>BÀI 6: TÍNH TRUNG BÌNH CỘNG</h2>
    <label for="array">Nhập mảng số (cách nhau bằng dấu phẩy):</label>
    <input type="text" id="array" placeholder="10, 20, 30, 40, 50">
    <button type="button" onclick="calculate()">Tính trung bình</button>
    <p id="result" aria-live="polite"></p>
    <script>
        function calculateAverage(numbers) {
            if (numbers.length === 0) return 0;
            let sum = 0;
            for (let i = 0; i < numbers.length; i++) sum += numbers[i];
            return sum / numbers.length;
        }

        function calculate() {
            const input = document.getElementById("array").value.trim();
            const numbers = input === "" ? [] : input.split(",").map(value => Number(value.trim()));
            const result = document.getElementById("result");
            if (numbers.some(number => !Number.isFinite(number))) {
                result.textContent = "Vui lòng chỉ nhập các số hợp lệ, cách nhau bằng dấu phẩy.";
                return;
            }
            result.textContent = `Trung bình cộng là: ${calculateAverage(numbers)}`;
        }
    </script>
</body>
</html>
