<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Max</title>
</head>
<body>
    <h2>FIND MAX</h2>
    <label for="array">Nhập mảng (các số cách nhau bằng dấu phẩy):</label>
    <input type="text" id="array" placeholder="vd:1, 3, 5, 7, 9">
    <br><br>
    <label for="findmax">Max</label>
    <button type="button" onclick="findMaxFromInput()">tìm Max</button>
    <p id="result" aria-live="polite"></p>

    <script>
        function findMax(numbers) {
            if (numbers.length === 0) {
                throw new Error("Mảng không được để trống.");
            }

            let max = numbers[0];
            for (let i = 1; i < numbers.length; i++) {
                if (numbers[i] > max) {
                    max = numbers[i];
                }
            }
            return max;
        }

        function findMaxFromInput() {
            const input = document.getElementById("array").value.trim();
            const result = document.getElementById("result");

            if (input === "") {
                result.textContent = "Vui lòng nhập một mảng số.";
                return;
            }

            const numbers = input.split(",").map(value => Number(value.trim()));
            if (numbers.some(number => !Number.isFinite(number))) {
                result.textContent = "Vui lòng chỉ nhập các số hợp lệ, cách nhau bằng dấu phẩy.";
                return;
            }

            result.textContent = `Số lớn nhất là: ${findMax(numbers)}`;
        }
    </script>
</body>
</html>
