<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 14 - Find Missing Number</title>
</head>
<body>
    <h2>BÀI 14: TÌM SỐ BỊ THIẾU</h2>
    <label for="array">Nhập mảng số từ 1 đến n (cách nhau bằng dấu phẩy):</label>
    <input type="text" id="array" placeholder="1, 2, 4, 5, 6">
    <label for="n">Nhập n:</label>
    <input type="text" id="n" placeholder="6">
    <button type="button" onclick="calculate()">Tìm số thiếu</button>
    <p id="result" aria-live="polite"></p>
    <script>
        function findMissingNumber(numbers, n) {
            let expectedSum = 0;
            let actualSum = 0;
            for (let i = 1; i <= n; i++) expectedSum += i;
            for (let i = 0; i < numbers.length; i++) actualSum += numbers[i];
            return expectedSum - actualSum;
        }

        function calculate() {
            const input = document.getElementById("array").value.trim();
            const nText = document.getElementById("n").value.trim();
            const result = document.getElementById("result");
            const n = Number(nText);
            const numbers = input === "" ? [] : input.split(",").map(value => Number(value.trim()));
            if (nText === "" || !Number.isSafeInteger(n) || n < 1 ||
                numbers.some(number => !Number.isSafeInteger(number) || number < 1 || number > n)) {
                result.textContent = "Vui lòng nhập n nguyên dương và các số nguyên hợp lệ trong khoảng 1 đến n.";
                return;
            }
            result.textContent = `Số bị thiếu là: ${findMissingNumber(numbers, n)}`;
        }
    </script>
</body>
</html>
