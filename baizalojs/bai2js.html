<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2 - Sum Odd Numbers</title>
</head>
<body>
    <h2>BÀI 2: TÍNH TỔNG SỐ LẺ</h2>
    <label for="array">Nhập mảng số (cách nhau bằng dấu phẩy):</label>
    <input type="text" id="array" placeholder="1, 2, 3, 4, 5">
    <button type="button" onclick="calculate()">Tính tổng</button>
    <p id="result" aria-live="polite"></p>
    <script>
        function sumOddNumbers(numbers) {
            let sum = 0;
            for (let i = 0; i < numbers.length; i++) {
                if (numbers[i] % 2 !== 0) sum += numbers[i];
            }
            return sum;
        }

        function calculate() {
            const input = document.getElementById("array").value.trim();
            const result = document.getElementById("result");
            if (input === "") {
                result.textContent = "Vui lòng nhập một mảng số.";
                return;
            }
            const numbers = input.split(",").map(value => Number(value.trim()));
            if (numbers.some(number => !Number.isFinite(number))) {
                result.textContent = "Vui lòng chỉ nhập các số hợp lệ, cách nhau bằng dấu phẩy.";
                return;
            }
            result.textContent = `Tổng các số lẻ là: ${sumOddNumbers(numbers)}`;
        }
    </script>
</body>
</html>
