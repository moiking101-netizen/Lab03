<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chương trình kiểm tra số chẵn – số lẻ</h2>
    <label for="number">Nhập một số:</label>
    <input type="number" id="number">
    <br><br>
    <button onclick="kiemtra()">Kiểm tra</button>
    <h3 id="result"></h3>
    <script>
        function kiemtra() {
            let number = Number(document.getElementById("number").value);
            if (number % 2 === 0) {
                document.getElementById("result").innerHTML = number + " là số chẵn.";
            } else {
                document.getElementById("result").innerHTML = number + " là số lẻ.";
            }
        }
    </script>
</body>
</html>
