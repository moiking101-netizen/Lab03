<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chương trình quay thưởng may mắn</h2>
    <button onclick="quayThuong()">Quay thưởng</button>
    <h3 id="result"></h3>
    <script>
        function quayThuong() {
            let prizes = ["Xe hơi", "Điện thoại", "Laptop", "Voucher mua sắm", "Tiền mặt", "Chuyến du lịch","chúc bạn may mắn lần sau"];
            let randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
            document.getElementById("result").innerHTML = "Chúc mừng! Bạn đã trúng thưởng: " + randomPrize;
        }
    </script>
</body>
</html>
