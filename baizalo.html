<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <table cellspacing="0" cellpadding="5">
        <form>
            <h2> Registration Form</h2>
            <tr>
                <td>Firstname</td>
                <td><input type="text" placeholder="Enter Firstname"></td>
            </tr>
                        <tr>
                <td>Lastname</td>
                <td><input type="text" placeholder="Enter Lastname"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="text" placeholder="Enter Email"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>Gender:</td>
            </tr>
            <tr>
                <td colspan="3">
                    <label><input type="radio" name="gender" value="male">Male</label><br>
                    <label><input type="radio" name="gender" value="female">Female</label><br>
                    <label><input type="radio" name="gender" value="other">Other</label>
                </td>
            </tr>
            <tr>
                <td>Age:</td>
                <td><label><input type="number" name="Age"></label></td>
            </tr>
            <tr>
                <td>References:</td>
            </tr>
            <tr>
                <td><label><input type="checkbox">Arcylic Painting</label><br>
                <label><input type="checkbox">Oil Painting</label><br>
                <label><input type="checkbox">Water Color Painting</label></td>
            </tr>
            <tr>
                <td> Select Occupation:</td>
                <td>
                    <select>
                        <option>Student</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Bio</td>
                <td><textarea placeholder="Share few line about yourself..."></textarea></td>
            </tr>
            <tr>
                <td> <button type="reset">Reset</button></td>
                <td> <button type="submit">Submit</button></td>
            </tr>
        </form>
    </table>
</body>
</html>
