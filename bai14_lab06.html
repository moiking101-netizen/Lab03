<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Chương trình tính chỉ số BMI</h2>
    <label for="weight">Nhập cân nặng (kg):</label>
    <input type="number" id="weight">
    <br><br>
    <label for="height">Nhập chiều cao (m):</label>
    <input type="number" id="height" step="0.01">
    <br><br>
    <button onclick="tinhBMI()">Tính BMI</button>
    <h3 id="result"></h3>
    <script>
        function tinhBMI() {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value);
            let result;

            if (height <= 0) {
                result = "Chiều cao phải lớn hơn 0.";
            } else {
                let bmi = weight / (height * height);
                result = "Chỉ số BMI của bạn là: " + bmi.toFixed(2);
            }

            document.getElementById("result").innerHTML = result;
        }
    </script>
</body>
</html>
